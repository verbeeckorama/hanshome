<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Home</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #333333;
            --text-muted: #555555;
            --border-color: #f0f0f0;
            --accent-color: #007bff;
            --danger-color: #dc3545;
            --success-color: #28a745;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 40px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header bar */
        .header-bar {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
            gap: 10px;
        }

        /* Tab Navigation */
        .tab-nav {
            display: flex;
            gap: 0;
            flex: 1;
            flex-wrap: wrap;
            align-items: center;
        }

        .tab-link {
            padding: 12px 20px;
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
            cursor: pointer;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
            font-size: 0.95rem;
            position: relative;
        }

        .tab-link:hover {
            color: var(--text-main);
        }

        .tab-link.active {
            color: var(--accent-color);
            border-bottom-color: var(--accent-color);
        }

        /* Tab edit controls */
        .tab-controls {
            display: none;
            position: absolute;
            top: -8px;
            right: -8px;
            gap: 2px;
        }

        body.editing .tab-controls {
            display: flex;
        }

        .tab-control-btn {
            width: 18px;
            height: 18px;
            background: #e0e0e0;
            border: none;
            border-radius: 50%;
            color: #666;
            cursor: pointer;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tab-control-btn:hover {
            background: var(--accent-color);
            color: white;
        }

        .tab-control-btn.delete:hover {
            background: var(--danger-color);
        }

        /* Add tab button */
        .add-tab-btn {
            padding: 8px 16px;
            background: transparent;
            border: 2px dashed #ddd;
            border-radius: 4px;
            color: #888;
            cursor: pointer;
            font-size: 0.85rem;
            margin-left: 8px;
            margin-bottom: -2px;
            display: none;
        }

        body.editing .add-tab-btn {
            display: block;
        }

        .add-tab-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* Header buttons */
        .header-buttons {
            display: flex;
            gap: 8px;
            padding-bottom: 10px;
        }

        .header-btn {
            padding: 8px 16px;
            background: #f0f0f0;
            border: none;
            border-radius: 6px;
            color: #666;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-btn:hover {
            background: #e0e0e0;
        }

        .header-btn.primary {
            background: var(--accent-color);
            color: white;
        }

        .header-btn.primary:hover {
            background: #0056b3;
        }

        .header-btn.active {
            background: var(--accent-color);
            color: white;
        }

        /* Dashboard */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 50px;
            max-width: 1100px;
            width: 100%;
        }

        @media (max-width: 900px) { .dashboard { grid-template-columns: 1fr; } }

        section {
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            position: relative;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        h2 {
            font-size: 1.1rem;
            margin: 0;
            font-weight: 600;
        }

        .link-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .link-item {
            display: flex;
            align-items: center;
            padding: 5px 0;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .link-item:hover { color: #000; }

        .link-item-wrapper {
            display: flex;
            align-items: center;
            padding: 5px 0;
            gap: 8px;
        }

        .link-item-wrapper .link-item {
            flex: 1;
            padding: 0;
        }

        .icon {
            width: 16px;
            height: 16px;
            margin-right: 12px;
            border-radius: 2px;
            object-fit: contain;
        }

        /* Edit mode controls */
        .edit-controls {
            display: none;
            gap: 4px;
        }

        body.editing .edit-controls {
            display: flex;
        }

        body.editing .link-item-wrapper {
            background: #fafafa;
            border-radius: 4px;
            padding: 5px 8px;
            margin: 2px 0;
        }

        body.editing .link-list {
            padding: 8px;
            background: #f8f9fa;
            border-radius: 6px;
            border: 2px dashed transparent;
            min-height: 50px;
        }

        .control-btn {
            width: 22px;
            height: 22px;
            background: #f0f0f0;
            border: none;
            border-radius: 3px;
            color: #666;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .control-btn:hover {
            background: #e0e0e0;
        }

        .control-btn.delete:hover {
            background: var(--danger-color);
            color: white;
        }

        .control-btn.up:hover,
        .control-btn.down:hover {
            background: var(--accent-color);
            color: white;
        }

        /* Add link form */
        .add-link-form {
            display: none;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 6px;
        }

        body.editing .add-link-form {
            display: flex;
        }

        .add-link-form input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .add-link-form input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .add-link-btn {
            padding: 8px 16px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .add-link-btn:hover {
            background: #0056b3;
        }

        /* Drag and drop styles */
        .link-item-wrapper.dragging {
            opacity: 0.5;
            background: #f0f0f0;
        }

        .link-item-wrapper.drag-over {
            border-top: 2px solid var(--accent-color);
        }

        body.editing .link-list.drag-over-section {
            border-color: var(--accent-color);
            background: #e8f4ff;
        }

        /* Add Section button */
        .add-section-btn {
            display: none;
            width: 100%;
            padding: 12px;
            background: #f8f9fa;
            border: 2px dashed #ddd;
            border-radius: 6px;
            color: #888;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            margin-top: 10px;
        }

        body.editing .add-section-btn {
            display: block;
        }

        .add-section-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background: #f0f7ff;
        }

        /* Delete section button */
        .delete-section-btn {
            width: 24px;
            height: 24px;
            background: #f0f0f0;
            border: none;
            border-radius: 4px;
            color: #888;
            cursor: pointer;
            font-size: 12px;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            margin-left: 4px;
        }

        body.editing .delete-section-btn {
            display: flex;
        }

        .delete-section-btn:hover {
            background: var(--danger-color);
            color: white;
        }

        .section-buttons {
            display: flex;
            gap: 4px;
        }

        /* Status indicator */
        .status {
            position: fixed;
            bottom: 20px;
            left: 20px;
            padding: 8px 16px;
            background: var(--success-color);
            color: white;
            border-radius: 4px;
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .status.show {
            opacity: 1;
        }

        /* Hidden file input */
        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

<div class="header-bar">
    <nav class="tab-nav" id="tabNav">
        <!-- Tabs will be rendered here -->
    </nav>
    <button class="add-tab-btn" onclick="addTab()">+ Add Tab</button>
    <div class="header-buttons">
        <button class="header-btn" onclick="toggleEditMode()" id="editToggle">✏️ Edit</button>
        <button class="header-btn" onclick="exportData()">📥 Export</button>
        <button class="header-btn" onclick="document.getElementById('fileInput').click()">📤 Import</button>
    </div>
</div>

<input type="file" id="fileInput" accept=".json" onchange="importData(event)">

<div class="dashboard" id="dashboard">
    <!-- Content will be loaded dynamically -->
</div>

<div class="status" id="status">Changes saved!</div>

<script>
    // Default data structure with tabs
    const defaultData = {
        activeTabId: 'main',
        tabs: [
            {
                id: 'main',
                name: 'Main',
                columns: [
                    {
                        sections: [
                            {
                                id: 'social',
                                title: 'Social',
                                links: [
                                    { url: 'https://twitter.com', name: 'Twitter' },
                                    { url: 'https://linkedin.com', name: 'LinkedIn' }
                                ]
                            },
                            {
                                id: 'news',
                                title: 'News',
                                links: [
                                    { url: 'https://www.tijd.be', name: 'De Tijd' },
                                    { url: 'https://www.ft.com', name: 'Financial Times' },
                                    { url: 'https://www.nytimes.com', name: 'The New York Times' },
                                    { url: 'https://www.eurointelligence.com', name: 'EuroIntelligence' },
                                    { url: 'https://www.euractiv.com', name: 'Euractiv' },
                                    { url: 'https://www.semafor.com', name: 'Semafor' },
                                    { url: 'https://ground.news', name: 'Ground News' },
                                    { url: 'https://www.project-syndicate.org', name: 'Project Syndicate' },
                                    { url: 'https://www.politico.eu', name: 'Politico.eu' },
                                    { url: 'https://www.zerohedge.com', name: 'ZeroHedge' },
                                    { url: 'https://www.spacedaily.com', name: 'Space Daily' },
                                    { url: 'https://siliconcontinent.com', name: 'Siliconcontinent.com' },
                                    { url: 'https://www.computable.be', name: 'Computable.be' },
                                    { url: 'https://www.vrt.be/vrtnws', name: 'VRT' },
                                    { url: 'https://store.stratnews.com', name: 'Store.stratnews.com' },
                                    { url: 'https://www.standaard.be', name: 'De Standaard' }
                                ]
                            }
                        ]
                    },
                    {
                        sections: [
                            {
                                id: 'inspiration',
                                title: 'Inspiration',
                                links: [
                                    { url: 'https://marginalrevolution.com', name: 'Marginal Revolution' },
                                    { url: 'https://thezvi.substack.com', name: 'thezvi' },
                                    { url: 'https://astralcodexten.substack.com', name: 'Astral Codex 10' },
                                    { url: 'https://restofworld.org/', name: 'Rest of World' },
                                    { url: 'https://unherd.com/', name: 'UnHerd' },
                                    { url: 'https://danwang.co/', name: 'Dan Wang' },
                                    { url: 'https://www.construction-physics.com/', name: 'Construction Physics' },
                                    { url: 'https://snscratchpad.com/', name: 'SNScratchpad' }
                                ]
                            }
                        ]
                    },
                    {
                        sections: []
                    }
                ]
            }
        ]
    };

    // Get favicon URL
    function getFaviconUrl(url) {
        try {
            const domain = new URL(url).hostname;
            return `https://www.google.com/s2/favicons?domain=${domain}`;
        } catch {
            return '';
        }
    }

    // Load data from localStorage or use default
    function loadData() {
        const saved = localStorage.getItem('homepageData');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                // Migration: convert old format to new tab-based format
                if (parsed.columns && !parsed.tabs) {
                    return {
                        activeTabId: 'main',
                        tabs: [{
                            id: 'main',
                            name: 'Main',
                            columns: parsed.columns
                        }]
                    };
                }
                return parsed;
            } catch {
                return JSON.parse(JSON.stringify(defaultData));
            }
        }
        return JSON.parse(JSON.stringify(defaultData));
    }

    // Save data to localStorage
    function saveData() {
        localStorage.setItem('homepageData', JSON.stringify(data));
        showStatus('Changes saved!');
    }

    // Show status message
    function showStatus(message) {
        const status = document.getElementById('status');
        status.textContent = message;
        status.classList.add('show');
        setTimeout(() => status.classList.remove('show'), 2000);
    }

    // Current data and state
    let data = loadData();
    let isEditMode = false;

    // Get active tab
    function getActiveTab() {
        return data.tabs.find(t => t.id === data.activeTabId) || data.tabs[0];
    }

    // Toggle global edit mode
    function toggleEditMode() {
        isEditMode = !isEditMode;
        document.body.classList.toggle('editing', isEditMode);
        const btn = document.getElementById('editToggle');
        btn.classList.toggle('active', isEditMode);
        btn.textContent = isEditMode ? '✔️ Done' : '✏️ Edit';
    }

    // Export data to JSON file
    function exportData() {
        const dataStr = JSON.stringify(data, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'my-home-backup.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showStatus('Exported successfully!');
    }

    // Import data from JSON file
    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const imported = JSON.parse(e.target.result);
                // Validate structure
                if (!imported.tabs || !Array.isArray(imported.tabs)) {
                    throw new Error('Invalid format');
                }
                data = imported;
                saveData();
                render();
                showStatus('Imported successfully!');
            } catch (err) {
                alert('Invalid file format. Please select a valid backup file.');
            }
        };
        reader.readAsText(file);
        event.target.value = ''; // Reset input
    }

    // Render tabs
    function renderTabs() {
        const tabNav = document.getElementById('tabNav');
        tabNav.innerHTML = '';

        data.tabs.forEach(tab => {
            const tabEl = document.createElement('button');
            tabEl.className = 'tab-link' + (tab.id === data.activeTabId ? ' active' : '');
            tabEl.textContent = tab.name;
            tabEl.onclick = (e) => {
                if (!e.target.closest('.tab-controls')) {
                    switchTab(tab.id);
                }
            };

            // Tab controls (rename, delete)
            const controls = document.createElement('div');
            controls.className = 'tab-controls';
            
            const renameBtn = document.createElement('button');
            renameBtn.className = 'tab-control-btn';
            renameBtn.innerHTML = '✏️';
            renameBtn.title = 'Rename tab';
            renameBtn.onclick = (e) => { e.stopPropagation(); renameTab(tab.id); };

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'tab-control-btn delete';
            deleteBtn.innerHTML = '✕';
            deleteBtn.title = 'Delete tab';
            deleteBtn.onclick = (e) => { e.stopPropagation(); deleteTab(tab.id); };

            controls.appendChild(renameBtn);
            if (data.tabs.length > 1) {
                controls.appendChild(deleteBtn);
            }
            tabEl.appendChild(controls);

            tabNav.appendChild(tabEl);
        });
    }

    // Switch to a tab
    function switchTab(tabId) {
        data.activeTabId = tabId;
        saveData();
        render();
    }

    // Add a new tab
    function addTab() {
        const name = prompt('Enter tab name:');
        if (!name || !name.trim()) return;

        const newTab = {
            id: 'tab-' + Date.now(),
            name: name.trim(),
            columns: [
                { sections: [] },
                { sections: [] },
                { sections: [] }
            ]
        };

        data.tabs.push(newTab);
        data.activeTabId = newTab.id;
        saveData();
        render();
    }

    // Rename a tab
    function renameTab(tabId) {
        const tab = data.tabs.find(t => t.id === tabId);
        if (!tab) return;

        const newName = prompt('Enter new name:', tab.name);
        if (!newName || !newName.trim()) return;

        tab.name = newName.trim();
        saveData();
        render();
    }

    // Delete a tab
    function deleteTab(tabId) {
        if (data.tabs.length <= 1) {
            alert('Cannot delete the last tab.');
            return;
        }

        const tab = data.tabs.find(t => t.id === tabId);
        if (!confirm(`Delete tab "${tab.name}" and all its content?`)) return;

        const index = data.tabs.findIndex(t => t.id === tabId);
        data.tabs.splice(index, 1);

        // Switch to another tab if we deleted the active one
        if (data.activeTabId === tabId) {
            data.activeTabId = data.tabs[0].id;
        }

        saveData();
        render();
    }

    // Render the dashboard
    function render() {
        renderTabs();

        const activeTab = getActiveTab();
        const dashboard = document.getElementById('dashboard');
        dashboard.innerHTML = '';

        activeTab.columns.forEach((column, colIndex) => {
            const colDiv = document.createElement('div');
            colDiv.className = 'column';
            colDiv.dataset.col = colIndex;

            column.sections.forEach((section, secIndex) => {
                const sectionEl = createSection(section, colIndex, secIndex);
                colDiv.appendChild(sectionEl);
            });

            // Add Section button
            const addSectionBtn = document.createElement('button');
            addSectionBtn.className = 'add-section-btn';
            addSectionBtn.textContent = '+ Add Section';
            addSectionBtn.onclick = () => addSection(colIndex);
            colDiv.appendChild(addSectionBtn);

            dashboard.appendChild(colDiv);
        });
    }

    // Create a section element
    function createSection(section, colIndex, secIndex) {
        const sectionEl = document.createElement('section');
        sectionEl.dataset.col = colIndex;
        sectionEl.dataset.sec = secIndex;

        const header = document.createElement('div');
        header.className = 'section-header';

        const title = document.createElement('h2');
        title.textContent = section.title;

        const buttonsDiv = document.createElement('div');
        buttonsDiv.className = 'section-buttons';

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-section-btn';
        deleteBtn.innerHTML = '🗑️';
        deleteBtn.title = 'Delete section';
        deleteBtn.onclick = () => deleteSection(colIndex, secIndex);

        buttonsDiv.appendChild(deleteBtn);
        header.appendChild(title);
        header.appendChild(buttonsDiv);
        sectionEl.appendChild(header);

        const linkList = document.createElement('div');
        linkList.className = 'link-list';
        linkList.dataset.col = colIndex;
        linkList.dataset.sec = secIndex;

        // Allow dropping links into this section
        linkList.addEventListener('dragover', handleLinkListDragOver);
        linkList.addEventListener('dragleave', handleLinkListDragLeave);
        linkList.addEventListener('drop', handleLinkListDrop);

        section.links.forEach((link, linkIndex) => {
            const wrapper = createLinkWrapper(link, colIndex, secIndex, linkIndex);
            linkList.appendChild(wrapper);
        });

        sectionEl.appendChild(linkList);

        // Add link form
        const addForm = document.createElement('div');
        addForm.className = 'add-link-form';
        addForm.innerHTML = `
            <input type="text" placeholder="Link name" class="link-name-input">
            <input type="url" placeholder="https://..." class="link-url-input">
            <button class="add-link-btn" onclick="addLink(${colIndex}, ${secIndex}, this)">Add Link</button>
        `;
        sectionEl.appendChild(addForm);

        return sectionEl;
    }

    // Create a link wrapper with controls
    function createLinkWrapper(link, colIndex, secIndex, linkIndex) {
        const wrapper = document.createElement('div');
        wrapper.className = 'link-item-wrapper';
        wrapper.draggable = true;
        wrapper.dataset.index = linkIndex;

        const linkEl = document.createElement('a');
        linkEl.href = link.url;
        linkEl.className = 'link-item';
        linkEl.innerHTML = `<img src="${getFaviconUrl(link.url)}" class="icon" alt="${link.name} favicon"> ${link.name}`;

        const controls = document.createElement('div');
        controls.className = 'edit-controls';
        controls.innerHTML = `
            <button class="control-btn up" onclick="moveLink(${colIndex}, ${secIndex}, ${linkIndex}, -1)" title="Move up">↑</button>
            <button class="control-btn down" onclick="moveLink(${colIndex}, ${secIndex}, ${linkIndex}, 1)" title="Move down">↓</button>
            <button class="control-btn delete" onclick="deleteLink(${colIndex}, ${secIndex}, ${linkIndex})" title="Delete">✕</button>
        `;

        wrapper.appendChild(linkEl);
        wrapper.appendChild(controls);

        // Drag and drop handlers
        wrapper.addEventListener('dragstart', handleDragStart);
        wrapper.addEventListener('dragover', handleDragOver);
        wrapper.addEventListener('dragleave', handleDragLeave);
        wrapper.addEventListener('drop', handleDrop);
        wrapper.addEventListener('dragend', handleDragEnd);

        return wrapper;
    }

    // Move a link up or down
    function moveLink(colIndex, secIndex, linkIndex, direction) {
        const activeTab = getActiveTab();
        const links = activeTab.columns[colIndex].sections[secIndex].links;
        const newIndex = linkIndex + direction;
        
        if (newIndex < 0 || newIndex >= links.length) return;
        
        const temp = links[linkIndex];
        links[linkIndex] = links[newIndex];
        links[newIndex] = temp;
        
        saveData();
        render();
    }

    // Delete a link
    function deleteLink(colIndex, secIndex, linkIndex) {
        if (confirm('Delete this link?')) {
            const activeTab = getActiveTab();
            activeTab.columns[colIndex].sections[secIndex].links.splice(linkIndex, 1);
            saveData();
            render();
        }
    }

    // Add a new link
    function addLink(colIndex, secIndex, btn) {
        const form = btn.parentElement;
        const nameInput = form.querySelector('.link-name-input');
        const urlInput = form.querySelector('.link-url-input');
        
        const name = nameInput.value.trim();
        let url = urlInput.value.trim();
        
        if (!name || !url) {
            alert('Please enter both name and URL');
            return;
        }
        
        // Add https if missing
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
            url = 'https://' + url;
        }
        
        const activeTab = getActiveTab();
        activeTab.columns[colIndex].sections[secIndex].links.push({ url, name });
        saveData();
        render();
    }

    // Drag and drop functionality
    let draggedElement = null;
    let draggedData = null;

    function handleDragStart(e) {
        if (!isEditMode) {
            e.preventDefault();
            return;
        }
        draggedElement = this;
        draggedData = {
            col: parseInt(this.closest('section').dataset.col),
            sec: parseInt(this.closest('section').dataset.sec),
            index: parseInt(this.dataset.index)
        };
        this.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragOver(e) {
        e.preventDefault();
        if (!isEditMode) return;
        if (draggedElement !== this) {
            this.classList.add('drag-over');
        }
    }

    function handleDragLeave(e) {
        this.classList.remove('drag-over');
    }

    function handleDrop(e) {
        e.preventDefault();
        e.stopPropagation();
        this.classList.remove('drag-over');
        
        if (draggedElement === this) return;
        
        const activeTab = getActiveTab();
        const targetData = {
            col: parseInt(this.closest('section').dataset.col),
            sec: parseInt(this.closest('section').dataset.sec),
            index: parseInt(this.dataset.index)
        };
        
        const movedLink = activeTab.columns[draggedData.col].sections[draggedData.sec].links.splice(draggedData.index, 1)[0];
        activeTab.columns[targetData.col].sections[targetData.sec].links.splice(targetData.index, 0, movedLink);
        
        saveData();
        render();
    }

    function handleDragEnd(e) {
        this.classList.remove('dragging');
        document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        document.querySelectorAll('.drag-over-section').forEach(el => el.classList.remove('drag-over-section'));
        draggedElement = null;
        draggedData = null;
    }

    function handleLinkListDragOver(e) {
        e.preventDefault();
        if (!draggedElement || !isEditMode) return;
        this.classList.add('drag-over-section');
    }

    function handleLinkListDragLeave(e) {
        if (!this.contains(e.relatedTarget)) {
            this.classList.remove('drag-over-section');
        }
    }

    function handleLinkListDrop(e) {
        e.preventDefault();
        this.classList.remove('drag-over-section');
        
        if (!draggedElement) return;
        
        const activeTab = getActiveTab();
        const targetCol = parseInt(this.dataset.col);
        const targetSec = parseInt(this.dataset.sec);
        
        if (draggedData.col === targetCol && draggedData.sec === targetSec) {
            return;
        }
        
        const movedLink = activeTab.columns[draggedData.col].sections[draggedData.sec].links.splice(draggedData.index, 1)[0];
        activeTab.columns[targetCol].sections[targetSec].links.push(movedLink);
        
        saveData();
        render();
    }

    // Add a new section
    function addSection(colIndex) {
        const title = prompt('Enter section name:');
        if (!title || !title.trim()) return;
        
        const activeTab = getActiveTab();
        const newSection = {
            id: title.toLowerCase().replace(/\s+/g, '-') + '-' + Date.now(),
            title: title.trim(),
            links: []
        };
        
        activeTab.columns[colIndex].sections.push(newSection);
        saveData();
        render();
    }

    // Delete a section
    function deleteSection(colIndex, secIndex) {
        const activeTab = getActiveTab();
        const section = activeTab.columns[colIndex].sections[secIndex];
        if (confirm(`Delete section "${section.title}" and all its links?`)) {
            activeTab.columns[colIndex].sections.splice(secIndex, 1);
            saveData();
            render();
        }
    }

    // Initial render
    render();
</script>

</body>
</html>
