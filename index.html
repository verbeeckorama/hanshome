<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Home - Local</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #333333;
            --text-muted: #555555;
            --border-color: #f0f0f0;
            --accent-color: #007bff;
            --danger-color: #dc3545;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 40px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Tab Navigation */
        .tab-nav {
            display: flex;
            gap: 0;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
            width: 100%;
            max-width: 1100px;
        }

        .tab-link {
            padding: 12px 24px;
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }

        .tab-link:hover {
            color: var(--text-main);
        }

        .tab-link.active {
            color: var(--accent-color);
            border-bottom-color: var(--accent-color);
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 50px;
            max-width: 1100px;
            width: 100%;
        }

        @media (max-width: 900px) { .dashboard { grid-template-columns: 1fr; } }

        section {
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            position: relative;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        h2 {
            font-size: 1.1rem;
            margin: 0;
            font-weight: 600;
        }

        /* Global edit mode toggle */
        .edit-mode-toggle {
            padding: 10px 20px;
            background: #f0f0f0;
            border: none;
            border-radius: 6px;
            color: #666;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
            margin-left: auto;
        }

        .edit-mode-toggle:hover {
            background: #e0e0e0;
        }

        .edit-mode-toggle.active {
            background: var(--accent-color);
            color: white;
        }

        .edit-mode-toggle.active:hover {
            background: #0056b3;
        }

        .link-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .link-item {
            display: flex;
            align-items: center;
            padding: 5px 0;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .link-item:hover { color: #000; }

        .link-item-wrapper {
            display: flex;
            align-items: center;
            padding: 5px 0;
            gap: 8px;
        }

        .link-item-wrapper .link-item {
            flex: 1;
            padding: 0;
        }

        .icon {
            width: 16px;
            height: 16px;
            margin-right: 12px;
            border-radius: 2px;
            object-fit: contain;
        }

        /* Edit mode controls */
        .edit-controls {
            display: none;
            gap: 4px;
        }

        body.editing .edit-controls {
            display: flex;
        }

        /* Edit mode visual indicators */
        body.editing .link-item-wrapper {
            background: #fafafa;
            border-radius: 4px;
            padding: 5px 8px;
            margin: 2px 0;
        }

        body.editing .link-list {
            padding: 8px;
            background: #f8f9fa;
            border-radius: 6px;
            border: 2px dashed transparent;
            min-height: 50px;
        }

        .control-btn {
            width: 22px;
            height: 22px;
            background: #f0f0f0;
            border: none;
            border-radius: 3px;
            color: #666;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .control-btn:hover {
            background: #e0e0e0;
        }

        .control-btn.delete:hover {
            background: var(--danger-color);
            color: white;
        }

        .control-btn.up:hover,
        .control-btn.down:hover {
            background: var(--accent-color);
            color: white;
        }

        /* Add link form */
        .add-link-form {
            display: none;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 6px;
        }

        body.editing .add-link-form {
            display: flex;
        }

        .add-link-form input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .add-link-form input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .add-link-btn {
            padding: 8px 16px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .add-link-btn:hover {
            background: #0056b3;
        }

        /* Drag and drop styles */
        .link-item-wrapper.dragging {
            opacity: 0.5;
            background: #f0f0f0;
        }

        .link-item-wrapper.drag-over {
            border-top: 2px solid var(--accent-color);
        }

        /* Reset button */
        .reset-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background: var(--danger-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .reset-btn:hover {
            background: #c82333;
        }

        /* Status indicator */
        .status {
            position: fixed;
            bottom: 20px;
            left: 20px;
            padding: 8px 16px;
            background: #28a745;
            color: white;
            border-radius: 4px;
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .status.show {
            opacity: 1;
        }

        /* Add Section button */
        .add-section-btn {
            display: none;
            width: 100%;
            padding: 12px;
            background: #f8f9fa;
            border: 2px dashed #ddd;
            border-radius: 6px;
            color: #888;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            margin-top: 10px;
        }

        body.editing .add-section-btn {
            display: block;
        }

        .add-section-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background: #f0f7ff;
        }

        /* Section drop zone for cross-section moves */
        body.editing .link-list.drag-over-section {
            border-color: var(--accent-color);
            background: #e8f4ff;
        }

        /* Delete section button */
        .delete-section-btn {
            width: 24px;
            height: 24px;
            background: #f0f0f0;
            border: none;
            border-radius: 4px;
            color: #888;
            cursor: pointer;
            font-size: 12px;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            margin-left: 4px;
        }

        body.editing .delete-section-btn {
            display: flex;
        }

        .delete-section-btn:hover {
            background: var(--danger-color);
            color: white;
        }

        /* Section header buttons container */
        .section-buttons {
            display: flex;
            gap: 4px;
        }

        /* Header bar with tabs and edit toggle */
        .header-bar {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
        }

        .header-bar .tab-nav {
            margin-bottom: 0;
            border-bottom: none;
            flex: 1;
        }
    </style>
</head>
<body>

<div class="header-bar">
    <nav class="tab-nav">
        <a href="index-original.html" class="tab-link">Original</a>
        <a href="index.html" class="tab-link active">Local</a>
    </nav>
    <button class="edit-mode-toggle" id="editToggle" onclick="toggleEditMode()">
        ✏️ Edit Mode
    </button>
</div>

<div class="dashboard" id="dashboard">
    <!-- Content will be loaded dynamically -->
</div>

<button class="reset-btn" onclick="resetToDefault()">Reset to Default</button>
<div class="status" id="status">Changes saved!</div>

<script>
    // Default data structure
    const defaultData = {
        columns: [
            {
                sections: [
                    {
                        id: 'social',
                        title: 'Social',
                        links: [
                            { url: 'https://twitter.com', name: 'Twitter' },
                            { url: 'https://linkedin.com', name: 'LinkedIn' }
                        ]
                    },
                    {
                        id: 'news',
                        title: 'News',
                        links: [
                            { url: 'https://www.tijd.be', name: 'De Tijd' },
                            { url: 'https://www.ft.com', name: 'Financial Times' },
                            { url: 'https://www.nytimes.com', name: 'The New York Times' },
                            { url: 'https://www.eurointelligence.com', name: 'EuroIntelligence' },
                            { url: 'https://www.euractiv.com', name: 'Euractiv' },
                            { url: 'https://www.semafor.com', name: 'Semafor' },
                            { url: 'https://ground.news', name: 'Ground News' },
                            { url: 'https://www.project-syndicate.org', name: 'Project Syndicate' },
                            { url: 'https://www.politico.eu', name: 'Politico.eu' },
                            { url: 'https://www.zerohedge.com', name: 'ZeroHedge' },
                            { url: 'https://www.spacedaily.com', name: 'Space Daily' },
                            { url: 'https://siliconcontinent.com', name: 'Siliconcontinent.com' },
                            { url: 'https://www.computable.be', name: 'Computable.be' },
                            { url: 'https://www.vrt.be/vrtnws', name: 'VRT' },
                            { url: 'https://store.stratnews.com', name: 'Store.stratnews.com' },
                            { url: 'https://www.standaard.be', name: 'De Standaard' }
                        ]
                    }
                ]
            },
            {
                sections: [
                    {
                        id: 'inspiration',
                        title: 'Inspiration',
                        links: [
                            { url: 'https://marginalrevolution.com', name: 'Marginal Revolution' },
                            { url: 'https://thezvi.substack.com', name: 'thezvi' },
                            { url: 'https://astralcodexten.substack.com', name: 'Astral Codex 10' },
                            { url: 'https://restofworld.org/', name: 'Rest of World' },
                            { url: 'https://unherd.com/', name: 'UnHerd' },
                            { url: 'https://danwang.co/', name: 'Dan Wang' },
                            { url: 'https://www.construction-physics.com/', name: 'Construction Physics' },
                            { url: 'https://snscratchpad.com/', name: 'SNScratchpad' }
                        ]
                    }
                ]
            },
            {
                sections: []
            }
        ]
    };

    // Get favicon URL
    function getFaviconUrl(url) {
        try {
            const domain = new URL(url).hostname;
            return `https://www.google.com/s2/favicons?domain=${domain}`;
        } catch {
            return '';
        }
    }

    // Load data from localStorage or use default
    function loadData() {
        const saved = localStorage.getItem('homepageData');
        if (saved) {
            try {
                return JSON.parse(saved);
            } catch {
                return defaultData;
            }
        }
        return defaultData;
    }

    // Save data to localStorage
    function saveData(data) {
        localStorage.setItem('homepageData', JSON.stringify(data));
        showStatus();
    }

    // Show save status
    function showStatus() {
        const status = document.getElementById('status');
        status.classList.add('show');
        setTimeout(() => status.classList.remove('show'), 2000);
    }

    // Reset to default
    function resetToDefault() {
        if (confirm('Are you sure you want to reset all changes? This cannot be undone.')) {
            localStorage.removeItem('homepageData');
            render();
            showStatus();
        }
    }

    // Current data
    let data = loadData();

    // Global edit mode
    let isEditMode = false;

    // Toggle global edit mode
    function toggleEditMode() {
        isEditMode = !isEditMode;
        document.body.classList.toggle('editing', isEditMode);
        const btn = document.getElementById('editToggle');
        btn.classList.toggle('active', isEditMode);
        btn.textContent = isEditMode ? '✔️ Done Editing' : '✏️ Edit Mode';
    }

    // Render the dashboard
    function render() {
        data = loadData();
        const dashboard = document.getElementById('dashboard');
        dashboard.innerHTML = '';

        data.columns.forEach((column, colIndex) => {
            const colDiv = document.createElement('div');
            colDiv.className = 'column';
            colDiv.dataset.col = colIndex;

            column.sections.forEach((section, secIndex) => {
                const sectionEl = createSection(section, colIndex, secIndex);
                colDiv.appendChild(sectionEl);
            });

            // Add Section button
            const addSectionBtn = document.createElement('button');
            addSectionBtn.className = 'add-section-btn';
            addSectionBtn.textContent = '+ Add Section';
            addSectionBtn.onclick = () => addSection(colIndex);
            colDiv.appendChild(addSectionBtn);

            dashboard.appendChild(colDiv);
        });
    }

    // Create a section element
    function createSection(section, colIndex, secIndex) {
        const sectionEl = document.createElement('section');
        sectionEl.dataset.col = colIndex;
        sectionEl.dataset.sec = secIndex;

        const header = document.createElement('div');
        header.className = 'section-header';

        const title = document.createElement('h2');
        title.textContent = section.title;

        const buttonsDiv = document.createElement('div');
        buttonsDiv.className = 'section-buttons';

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-section-btn';
        deleteBtn.innerHTML = '🗑️';
        deleteBtn.title = 'Delete section';
        deleteBtn.onclick = () => deleteSection(colIndex, secIndex);

        buttonsDiv.appendChild(deleteBtn);
        header.appendChild(title);
        header.appendChild(buttonsDiv);
        sectionEl.appendChild(header);

        const linkList = document.createElement('div');
        linkList.className = 'link-list';
        linkList.dataset.col = colIndex;
        linkList.dataset.sec = secIndex;

        // Allow dropping links into this section
        linkList.addEventListener('dragover', handleLinkListDragOver);
        linkList.addEventListener('dragleave', handleLinkListDragLeave);
        linkList.addEventListener('drop', handleLinkListDrop);

        section.links.forEach((link, linkIndex) => {
            const wrapper = createLinkWrapper(link, colIndex, secIndex, linkIndex);
            linkList.appendChild(wrapper);
        });

        sectionEl.appendChild(linkList);

        // Add link form
        const addForm = document.createElement('div');
        addForm.className = 'add-link-form';
        addForm.innerHTML = `
            <input type="text" placeholder="Link name" class="link-name-input">
            <input type="url" placeholder="https://..." class="link-url-input">
            <button class="add-link-btn" onclick="addLink(${colIndex}, ${secIndex}, this)">Add Link</button>
        `;
        sectionEl.appendChild(addForm);

        return sectionEl;
    }

    // Create a link wrapper with controls
    function createLinkWrapper(link, colIndex, secIndex, linkIndex) {
        const wrapper = document.createElement('div');
        wrapper.className = 'link-item-wrapper';
        wrapper.draggable = true;
        wrapper.dataset.index = linkIndex;

        const linkEl = document.createElement('a');
        linkEl.href = link.url;
        linkEl.className = 'link-item';
        linkEl.innerHTML = `<img src="${getFaviconUrl(link.url)}" class="icon" alt="${link.name} favicon"> ${link.name}`;

        const controls = document.createElement('div');
        controls.className = 'edit-controls';
        controls.innerHTML = `
            <button class="control-btn up" onclick="moveLink(${colIndex}, ${secIndex}, ${linkIndex}, -1)" title="Move up">↑</button>
            <button class="control-btn down" onclick="moveLink(${colIndex}, ${secIndex}, ${linkIndex}, 1)" title="Move down">↓</button>
            <button class="control-btn delete" onclick="deleteLink(${colIndex}, ${secIndex}, ${linkIndex})" title="Delete">✕</button>
        `;

        wrapper.appendChild(linkEl);
        wrapper.appendChild(controls);

        // Drag and drop handlers
        wrapper.addEventListener('dragstart', handleDragStart);
        wrapper.addEventListener('dragover', handleDragOver);
        wrapper.addEventListener('dragleave', handleDragLeave);
        wrapper.addEventListener('drop', handleDrop);
        wrapper.addEventListener('dragend', handleDragEnd);

        return wrapper;
    }

    // Move a link up or down
    function moveLink(colIndex, secIndex, linkIndex, direction) {
        const links = data.columns[colIndex].sections[secIndex].links;
        const newIndex = linkIndex + direction;
        
        if (newIndex < 0 || newIndex >= links.length) return;
        
        const temp = links[linkIndex];
        links[linkIndex] = links[newIndex];
        links[newIndex] = temp;
        
        saveData(data);
        render();
    }

    // Delete a link
    function deleteLink(colIndex, secIndex, linkIndex) {
        if (confirm('Delete this link?')) {
            data.columns[colIndex].sections[secIndex].links.splice(linkIndex, 1);
            saveData(data);
            render();
        }
    }

    // Add a new link
    function addLink(colIndex, secIndex, btn) {
        const form = btn.parentElement;
        const nameInput = form.querySelector('.link-name-input');
        const urlInput = form.querySelector('.link-url-input');
        
        const name = nameInput.value.trim();
        let url = urlInput.value.trim();
        
        if (!name || !url) {
            alert('Please enter both name and URL');
            return;
        }
        
        // Add https if missing
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
            url = 'https://' + url;
        }
        
        data.columns[colIndex].sections[secIndex].links.push({ url, name });
        saveData(data);
        render();
    }

    // Drag and drop functionality
    let draggedElement = null;
    let draggedData = null;

    function handleDragStart(e) {
        if (!isEditMode) {
            e.preventDefault();
            return;
        }
        draggedElement = this;
        draggedData = {
            col: parseInt(this.closest('section').dataset.col),
            sec: parseInt(this.closest('section').dataset.sec),
            index: parseInt(this.dataset.index)
        };
        this.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragOver(e) {
        e.preventDefault();
        if (!isEditMode) return;
        if (draggedElement !== this) {
            this.classList.add('drag-over');
        }
    }

    function handleDragLeave(e) {
        this.classList.remove('drag-over');
    }

    function handleDrop(e) {
        e.preventDefault();
        e.stopPropagation();
        this.classList.remove('drag-over');
        
        if (draggedElement === this) return;
        
        const targetData = {
            col: parseInt(this.closest('section').dataset.col),
            sec: parseInt(this.closest('section').dataset.sec),
            index: parseInt(this.dataset.index)
        };
        
        // Get the link being moved
        const movedLink = data.columns[draggedData.col].sections[draggedData.sec].links.splice(draggedData.index, 1)[0];
        
        // Insert at the target position
        data.columns[targetData.col].sections[targetData.sec].links.splice(targetData.index, 0, movedLink);
        
        saveData(data);
        render();
    }

    function handleDragEnd(e) {
        this.classList.remove('dragging');
        document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        document.querySelectorAll('.drag-over-section').forEach(el => el.classList.remove('drag-over-section'));
        draggedElement = null;
        draggedData = null;
    }

    // Handle dropping on the link-list itself (for empty sections or end of list)
    function handleLinkListDragOver(e) {
        e.preventDefault();
        if (!draggedElement || !isEditMode) return;
        this.classList.add('drag-over-section');
    }

    function handleLinkListDragLeave(e) {
        // Only remove if we're leaving the link-list entirely
        if (!this.contains(e.relatedTarget)) {
            this.classList.remove('drag-over-section');
        }
    }

    function handleLinkListDrop(e) {
        e.preventDefault();
        this.classList.remove('drag-over-section');
        
        if (!draggedElement) return;
        
        const targetCol = parseInt(this.dataset.col);
        const targetSec = parseInt(this.dataset.sec);
        
        // Don't process if dropping on same section at the end
        if (draggedData.col === targetCol && draggedData.sec === targetSec) {
            return; // Let the individual link-item handle reordering
        }
        
        // Move link to end of target section
        const movedLink = data.columns[draggedData.col].sections[draggedData.sec].links.splice(draggedData.index, 1)[0];
        data.columns[targetCol].sections[targetSec].links.push(movedLink);
        
        saveData(data);
        render();
    }

    // Add a new section
    function addSection(colIndex) {
        const title = prompt('Enter section name:');
        if (!title || !title.trim()) return;
        
        const newSection = {
            id: title.toLowerCase().replace(/\s+/g, '-'),
            title: title.trim(),
            links: []
        };
        
        data.columns[colIndex].sections.push(newSection);
        saveData(data);
        render();
    }

    // Delete a section
    function deleteSection(colIndex, secIndex) {
        const section = data.columns[colIndex].sections[secIndex];
        if (confirm(`Delete section "${section.title}" and all its links?`)) {
            // Clean up editing state
            const key = `${colIndex}-${secIndex}`;
            editingSections.delete(key);
            
            data.columns[colIndex].sections.splice(secIndex, 1);
            saveData(data);
            render();
        }
    }

    // Initial render
    render();
</script>

</body>
</html>
